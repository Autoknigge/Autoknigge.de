backend:
  name: git-gateway
  branch: main

media_folder: ""
public_folder: "/"

collections:
  - name: "seiten"
    label: "Seiten"
    files:
      - file: "index.html"
        label: "Startseite"
        name: "index"
        fields:
          - { label: "Titel", name: "title", widget: "string" }
          - { label: "HTML Quellcode", name: "body", widget: "code", default_language: "html" }
